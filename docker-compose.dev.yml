services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kartex
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: kartex
    ports:
      - "5432:5432"
    volumes:
      - pg_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kartex"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_data_dev:
